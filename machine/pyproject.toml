[project]
name = "machine"
version = "0.1.0"
description = ""
authors = [
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch (>=2.11.0,<3.0.0)",
    "torchvision (>=0.26.0,<0.27.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "networkx (>=3.6.1,<4.0.0)",
    "osmnx (>=2.1.0,<3.0.0)",
    "folium (>=0.20.0,<0.21.0)",
    "geopy (>=2.4.1,<3.0.0)",
    "pybind11 (>=3.0.2,<4.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "torch-geometric (>=2.7.0,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
