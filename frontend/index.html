<!doctype html>
<html lang="pt-BR">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('zeno.theme') === 'light' ? 'light' : 'dark' }
      catch { document.documentElement.dataset.theme = 'dark' }

    <!-- Matches the bar, so a phone's browser chrome continues the console. -->

  </head>
